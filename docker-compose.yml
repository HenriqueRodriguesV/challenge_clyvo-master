services:
  h2-db:
    build:
      context: .
      dockerfile: Dockerfile.h2
    container_name: clyvo-h2-db
    restart: unless-stopped
    volumes:
      - h2-data:/data/h2
    ports:
      - "8082:8082"
      - "9092:9092"
    networks:
      - clyvo-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clyvo-api
    restart: unless-stopped
    depends_on:
      - h2-db
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: "jdbc:h2:tcp://h2-db:9092/challenge_clyvo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE"
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ""
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"
    networks:
      - clyvo-net

volumes:
  h2-data:
    name: clyvo-h2-data

networks:
  clyvo-net:
    name: clyvo-net